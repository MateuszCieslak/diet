name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # Build a self-contained release (app + production node_modules + migrations), copy it to the VPS,
  # apply migrations, switch the `current` symlink and restart. Server layout under /var/www/diet:
  #   shared/.env      environment for the app and migrations (managed on the server, never deployed)
  #   releases/<sha>/  one directory per deploy; the last 5 are kept
  #   current          symlink to the live release
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack release
        run: |
          mkdir release
          cp -r build drizzle scripts package.json pnpm-lock.yaml release/
          # Production dependencies are installed here (linux-x64, like the VPS), so the server
          # needs only Node 22. --ignore-scripts skips the `prepare` script (svelte-kit sync).
          (cd release && pnpm install --prod --frozen-lockfile --ignore-scripts)
          tar -czf diet.tar.gz -C release .

      - name: Copy release to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          PASSPHRASE: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          source: diet.tar.gz
          target: /var/www/diet/incoming

      - name: Migrate and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: /var/www/diet
          SHA: ${{ github.sha }}
          RESTART_COMMAND: sudo service supervisor restart
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          PASSPHRASE: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT || 22 }}
          envs: APP_DIR,SHA,RESTART_COMMAND
          script_stop: true
          script: |
            set -e
            REL="$APP_DIR/releases/$SHA"
            mkdir -p "$REL"
            tar -xzf "$APP_DIR/incoming/diet.tar.gz" -C "$REL"
            rm -f "$APP_DIR/incoming/diet.tar.gz"
            # Migrate before switching: if it fails, the old release keeps running.
            node --env-file="$APP_DIR/shared/.env" "$REL/scripts/migrate.js"
            ln -sfn "$REL" "$APP_DIR/current"
            eval "$RESTART_COMMAND"
            cd "$APP_DIR/releases" && ls -1t | tail -n +6 | xargs -r rm -rf
